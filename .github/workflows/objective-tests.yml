name: Objective grading tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  objective-tests:
    name: Objective grading tests (Node.js 24)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run objective grading tests
        run: node --test tests/objective.test.cjs
